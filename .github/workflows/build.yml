# Build .debs for every supported distro and architecture, smoke test them,
# and publish the signed apt repository to GitHub Pages.
#
# Packages are built inside distro containers so each suite's packages are
# built against that distro's toolchain and libsodium. arm64 uses GitHub's
# free arm runners for public repos.
name: build

on:
  push:
    branches: [main]
    # docs don't need a rebuild, and official/** is covered by official.yml
    paths-ignore:
      - "**.md"
      - "official/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "official/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: install build tools
        run: |
          apt-get update
          apt-get install -y build-essential debhelper cmake libsodium-dev \
            devscripts git curl ca-certificates

      - uses: actions/checkout@v4

      # schema is a Go program; the distro toolchains span years, so the
      # build uses the toolchain pinned in versions.env instead.
      - name: install pinned Go toolchain
        run: ./scripts/install-go.sh

      - name: build all packages
        run: ./scripts/build-all.sh

      - name: smoke test
        run: ./scripts/smoke-test.sh

      - name: distro codename
        id: dist
        run: echo "codename=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ steps.dist.outputs.codename }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  # Run schema's debian/tests/ for real, the way official.yml does for the
  # official tree: build the package, then autopkgtest the built .deb with
  # the null runner in a disposable container (see scripts/run-autopkgtest.sh
  # for why null). schema is the only packages/* entry with an autopkgtest —
  # the C libraries are covered by the smoke test and their official-track
  # tests.
  autopkgtest-schema:
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # --no-install-recommends: the testbed starts minimal so the test's
      # own Depends line is what provides its environment.
      - name: install build tools and autopkgtest
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts autopkgtest dpkg-dev \
            apt-utils git curl ca-certificates

      - uses: actions/checkout@v4

      - name: install pinned Go toolchain
        run: ./scripts/install-go.sh

      - name: build schema package
        run: ./scripts/build-package.sh schema

      # Only exit 0 is a pass: skipped or missing tests are the failure this
      # job exists to catch (autopkgtest(1) EXIT STATUS).
      - name: run autopkgtest
        run: |
          rc=0
          autopkgtest --no-built-binaries \
            --output-dir out-autopkgtest/schema \
            --summary out-autopkgtest/schema.summary \
            build/schema/schema_*.deb build/schema/schema-*/ \
            -- null || rc=$?
          for f in out-autopkgtest/schema/*-stdout out-autopkgtest/schema/*-stderr; do
            [ -s "$f" ] || continue
            echo "--- $(basename "$f") ---"
            cat "$f"
          done
          if [ -s out-autopkgtest/schema.summary ]; then
            cat out-autopkgtest/schema.summary
          fi
          echo "autopkgtest exit $rc"
          [ "$rc" -eq 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopkgtest-logs-schema
          path: out-autopkgtest/
          if-no-files-found: warn

  publish:
    # PR builds validate the packages but never publish.
    if: github.event_name != 'pull_request'
    needs: [build, autopkgtest-schema]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "APT_SIGNING_KEY secret is not set — run scripts/generate-signing-key.sh (see README)"; exit 1; }
          echo "$APT_SIGNING_KEY" | gpg --batch --import

      - name: assemble and sign apt repository
        run: ./scripts/make-apt-repo.sh incoming site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
